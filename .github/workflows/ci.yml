name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -m "not integration"

  integration:
    name: Deploy and pipeline on SQL Server 2022
    needs: quality
    runs-on: ubuntu-24.04
    env:
      EDP_ENV: ci
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # Matches config/ci.env. Throwaway container, lives for one run only.
          MSSQL_SA_PASSWORD: CiOnly!Throwaway_2026
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Microsoft ODBC Driver 18
        run: |
          if odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            echo "ODBC Driver 18 already installed"
          else
            curl -sSL -o /tmp/packages-microsoft-prod.deb \
              "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 unixodbc-dev
          fi

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Wait for SQL Server
        run: python -m edpipe.db

      - name: Deploy (PowerShell, as an operator would)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          ./scripts/deploy.ps1 -Environment ci *>&1 | Tee-Object logs/deploy.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Redeploy is a no-op (idempotency check)
        shell: pwsh
        run: |
          ./scripts/deploy.ps1 -Environment ci *>&1 | Tee-Object logs/redeploy.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Select-String -Path logs/redeploy.log -Pattern 'up to date' -Quiet)) { throw 'Redeploy applied changes' }

      - name: Integration tests
        run: |
          set -o pipefail
          pytest -m integration -x 2>&1 | tee logs/integration.log

      - name: Data quality on the replicated demo data
        run: |
          set -o pipefail
          python -m edpipe.sources.emr_sim reset
          python -m edpipe.sources.emr_sim replay --all
          python -m edpipe.replicate
          python -m edpipe.dq 2>&1 | tee logs/dq-demo.log
          python - <<'PY' | tee logs/dq-report.log
          from edpipe.config import Settings
          from edpipe.db import connect
          s = Settings.load()
          with connect(s, s.warehouse_db, autocommit=True) as c:
              print("== Rule summary ==")
              for r in c.execute("SELECT rule_code, severity, open_exceptions FROM rpt.dq_rule_summary ORDER BY severity, rule_code"):
                  print(f"{r.severity:<8} {r.rule_code:<36} {r.open_exceptions}")
              print("== Stays: loaded vs quarantined ==")
              print(tuple(c.execute("SELECT (SELECT COUNT(*) FROM dw.fact_ed_stay), (SELECT COUNT(*) FROM rpt.dq_quarantine)").fetchone()))
              print("== Pain values not in the map and not 0 to 10 ==")
              for r in c.execute("SELECT v.pain, COUNT(*) n FROM ods.emr_ed_vitalsign v JOIN dw.fact_ed_stay s ON s.stay_id = v.stay_id "
                                 "WHERE v.pain IS NOT NULL AND NOT EXISTS (SELECT 1 FROM ref.pain_value_map m WHERE m.raw_value = v.pain) "
                                 "AND TRY_CAST(v.pain AS decimal(5,2)) IS NULL GROUP BY v.pain ORDER BY n DESC"):
                  print(f"{r.pain!r:<30} {r.n}")
              print("== Rhythm values not in the map ==")
              for r in c.execute("SELECT v.rhythm, COUNT(*) n FROM ods.emr_ed_vitalsign v WHERE v.rhythm IS NOT NULL AND NOT EXISTS "
                                 "(SELECT 1 FROM ref.rhythm_map m WHERE m.raw_value = v.rhythm) GROUP BY v.rhythm ORDER BY n DESC"):
                  print(f"{r.rhythm!r:<30} {r.n}")
              print("== Sample of open Error exceptions ==")
              for r in c.execute("SELECT TOP (15) rule_code, stay_id, detail FROM rpt.dq_open_exception WHERE severity = 'Error' ORDER BY rule_code, stay_id"):
                  print(r.rule_code, r.stay_id, r.detail)
          PY

      - name: Show the data quality report on the run summary
        if: always()
        run: |
          for f in logs/dq-demo.log logs/dq-report.log; do
            [ -f "$f" ] || continue
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$(basename "$f")::$msg"
          done

      - name: Surface failure details as annotations
        if: failure()
        run: |
          python -m edpipe.health > logs/zz-health.log 2>&1 || true
          if [ -f logs/integration.log ]; then
            awk '/= FAILURES =/{f=1} f' logs/integration.log | head -n 90 > logs/integration-first-failure.log
          fi
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$f")::$msg"
          done
