name: Probe AIHW API

# Manual run: call the live MyHospitals API from a GitHub runner, record the raw responses and
# publish them to the aihw-probe branch. Used to design the client and to refresh test fixtures.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Call the API
        run: |
          mkdir -p probe
          base=https://myhospitalsapi.aihw.gov.au/api/v1
          get() {
            out="probe/$1.json"; shift
            code=$(curl -sS -m 60 --retry 3 -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$@" || echo curlfail)
            echo "$out -> $code ($(wc -c < "$out" 2>/dev/null || echo 0) bytes)" | tee -a probe/_status.txt
          }
          get measure_categories "$base/measure-categories"
          get suppressions "$base/suppressions"
          get caveats "$base/caveats"
          get reporting_unit_types "$base/reporting-unit-types"
          get flat_ed_time_p1 "$base/flat-data-extract/MYH-ED-TIME?skip=0&top=5"
          get flat_ed_time_p2 "$base/flat-data-extract/MYH-ED-TIME?skip=5&top=5"
          get flat_ed_time_alfred "$base/flat-data-extract/MYH-ED-TIME?reporting_unit_code=H0358&top=1000"
          get flat_ed_time_all "$base/flat-data-extract/MYH-ED-TIME?top=1000"
          get flat_ed_time_big "$base/flat-data-extract/MYH-ED-TIME?top=5000"
          get flat_ed_time_cat "$base/flat-data-extract/MYH-ED-TIME?measure_code=MYH0005&reporting_unit_code=H0358"
          get flat_formatted "$base/flat-formatted-data-extract/MYH-ED-TIME?top=5"
          get measure_downloads "$base/measure-downloads/measure-download-codes"
          get ed_measures "$base/measure-categories/MYH-ED-TIME/measures"
          get flat_ed_wait "$base/flat-data-extract/MYH-ED-WAIT?top=3"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r probe /tmp/probe
          git switch --orphan aihw-probe
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/probe/. .
          git add -A
          git commit -qm "AIHW API probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin aihw-probe
