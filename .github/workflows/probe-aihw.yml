name: Probe AIHW API

# Manual run: probe endpoints and external sources, publish results to the aihw-probe branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          mkdir -p probe
          base=https://myhospitalsapi.aihw.gov.au/api/v1
          ua="ed-data-integration-pipeline/0.1 (probe)"
          get() { out="probe/$1.json"; shift; code=$(curl -sS -m 60 -A "$ua" -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$@" || echo fail); echo "$out -> $code $(wc -c < "$out") bytes" | tee -a probe/_status.txt; }
          get rua_myh0005 "$base/measures/MYH0005/reporting-units-available"
          get cat_ed "$base/measure-categories/MYH-ED/measures"
          get cat_waits "$base/measure-categories/MYH-ED-WAITS/measures"
          get cat_time "$base/measure-categories/MYH-ED-TIME/measures"
          curl -sS -m 60 -L -o probe/data.csv "https://zenodo.org/api/records/23123800/files/data.csv/content"
          curl -sS -m 60 -L -o probe/schema.json "https://zenodo.org/api/records/23123800/files/schema.json/content"
          curl -sS -m 60 -L -o probe/publicdata.json "https://zenodo.org/api/records/23123800/files/publicdata.json/content"
          ls -la probe | tee -a probe/_status.txt
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r probe /tmp/probe
          git switch --orphan aihw-probe
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/probe/. .
          git add -A
          git commit -qm "probe"
          git push -f origin aihw-probe
