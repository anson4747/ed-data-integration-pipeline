name: Probe AIHW API

# Manual run: call the live MyHospitals API from a GitHub runner, record the raw responses and
# publish them to the aihw-probe branch. Used to design the client and to refresh test fixtures.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Call the API
        run: |
          mkdir -p probe
          base=https://myhospitalsapi.aihw.gov.au/api/v1
          get() {
            out="probe/$1.json"; shift
            code=$(curl -sS -m 60 --retry 3 -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$@" || echo curlfail)
            echo "$out -> $code ($(wc -c < "$out" 2>/dev/null || echo 0) bytes)" | tee -a probe/_status.txt
          }
          for cat in MYH-ED-TIME MYH-ED MYH-ED-WAITS; do
            n=0; skip=0
            while :; do
              get "page_${cat}_${skip}" "$base/flat-data-extract/$cat?skip=$skip&top=1000"
              c=$(python3 -c "import json;print(len(json.load(open('probe/page_${cat}_${skip}.json'))['result']['data']))" 2>/dev/null || echo 0)
              n=$((n+c)); echo "$cat skip=$skip rows=$c" | tee -a probe/_status.txt
              [ "$c" -lt 1000 ] && break
              skip=$((skip+1000))
            done
            echo "TOTAL $cat $n" | tee -a probe/_status.txt
          done
          get alfred_ed_time "$base/flat-data-extract/MYH-ED-TIME?skip=0&top=1000&reporting_unit_code=H0358"
          get alfred_ed "$base/flat-data-extract/MYH-ED?skip=0&top=1000&reporting_unit_code=H0358"
          get alfred_ed_waits "$base/flat-data-extract/MYH-ED-WAITS?skip=0&top=1000&reporting_unit_code=H0358"
          get beyond_end "$base/flat-data-extract/MYH-ED-TIME?skip=9999999&top=10"
          get bad_category "$base/flat-data-extract/NOPE?skip=0&top=10"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r probe /tmp/probe
          git switch --orphan aihw-probe
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/probe/. .
          git add -A
          git commit -qm "AIHW API probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin aihw-probe
