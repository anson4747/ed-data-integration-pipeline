name: Probe AIHW API

# Manual run: probe endpoints and external sources, publish results to the aihw-probe branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          mkdir -p probe
          base=https://myhospitalsapi.aihw.gov.au/api/v1
          ua="ed-data-integration-pipeline/0.1 (probe)"
          get() { out="probe/$1.json"; shift; code=$(curl -sS -m 60 -A "$ua" -H 'Accept: application/json' -o "$out" -w '%{http_code}' "$@" || echo fail); echo "$out -> $code $(wc -c < "$out") bytes" | tee -a probe/_status.txt; }
          get ma_alfred "$base/reporting-units/H0358/measures-available"
          get ma_caulfield "$base/reporting-units/H0345/measures-available"
          get ma_vic "$base/reporting-units/Vic/measures-available"
          get ma_lhn "$base/reporting-units/LHN268/measures-available"
          get zenodo_record "https://zenodo.org/api/records/23123800"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r probe /tmp/probe
          git switch --orphan aihw-probe
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/probe/. .
          git add -A
          git commit -qm "probe"
          git push -f origin aihw-probe
